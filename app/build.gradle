plugins { id 'com.android.application' }

android {
    namespace 'fr.nico.carnet'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.nico.carnet'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
    }
    signingConfigs {
        release {
            if (System.getenv('CARNET_KEYSTORE')) {
                storeFile file(System.getenv('CARNET_KEYSTORE'))
                storePassword System.getenv('CARNET_STORE_PASSWORD')
                keyAlias 'carnet'
                keyPassword System.getenv('CARNET_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
